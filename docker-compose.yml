services:
  mongo:
    image: mongo:7
    container_name: smartparking-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: SmartParkingDb
    volumes:
      - smartparking_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  smartparking_mongo_data:
